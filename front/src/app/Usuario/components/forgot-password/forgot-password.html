<div class="fp">
  <aside class="fp-brand">
    <img class="fp-brand__logo" src="/images/logo.png" alt="Logo SAPA">
  </aside>

  <div class="fp-side">
    <form class="fp-form" novalidate (submit)="enviar($event)">
      <header class="fp-form__head">
        <h1 class="fp-form__title">Recuperá tu contraseña</h1>
        <p class="fp-form__lead">Ingresá tu email y te enviamos los pasos para reiniciarla.</p>
      </header>

      <label class="fp-field">
        <span class="fp-label">Email</span>
        <input type="email" autocomplete="email" [formField]="formulario">
        <app-form-error [field]="formulario()" />
      </label>

      <button class="fp-submit" type="submit">Enviar</button>
    </form>
  </div>
</div>
