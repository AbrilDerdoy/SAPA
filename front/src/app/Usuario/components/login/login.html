<div class="container">
    <aside class="left">
        <img src="/images/logo.png" alt="Logo SAPA">
    </aside>
    
    <form class="right" novalidate (submit)="enviar($event)">
        <h2>Informacion Personal</h2>
        @if (aviso(); as mensaje) {
            <p
                [class.server-info]="mensaje.tipo === 'info'"
                [class.server-error]="mensaje.tipo === 'error'"
                [attr.role]="mensaje.tipo === 'error' ? 'alert' : 'status'">
                {{ mensaje.texto }}
            </p>
        }
        <label>
            Email:
            <input type="email" [formField]="formulario.email">
            <app-form-error [field]="formulario.email()"/>
        </label>
        <label>
            Contraseña:
            <div class="password-input">
                <input [type]="mostrarPassword() ? 'text' : 'password'" [formField]="formulario.password">
                <button
                    class="btn-toggle-password"
                    type="button"
                    [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                    [attr.aria-pressed]="mostrarPassword()"
                    (click)="alternarVisibilidadPassword()">
                    <img [src]="mostrarPassword() ? '/images/eye-off.svg' : '/images/eye.svg'" alt="">
                </button>
            </div>
            <app-form-error [field]="formulario.password()"/>
            <p><a [routerLink]="['/forgotPassword']">¿Olvidaste tu contraseña?</a></p>
        </label>
        <button class="btn-enviar" type="submit">Enviar</button>
    </form>
</div>
