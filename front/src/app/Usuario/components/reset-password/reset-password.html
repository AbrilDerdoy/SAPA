<div class="fp">
  <aside class="fp-brand">
    <img class="fp-brand__logo" src="/images/logo.png" alt="Logo SAPA">
  </aside>

  <div class="fp-side">
    <form class="fp-form" novalidate (submit)="enviar($event)">
      <header class="fp-form__head">
        <h1 class="fp-form__title">Nueva contraseña</h1>
        <p class="fp-form__lead">Ingresá y confirmá tu nueva contraseña para acceder a tu cuenta.</p>
      </header>

      @if (!token) {
        <p class="server-info" role="status">
          El enlace no es válido o está incompleto. 
          <a [routerLink]="['/forgotPassword']">Pedí uno nuevo</a>.
        </p>
      }

      <label class="fp-field">
        <span class="fp-label">Contraseña nueva</span>
        <input type="password" [formField]="formulario.password">
        <app-form-error [field]="formulario.password()" />
      </label>

      <label class="fp-field">
        <span class="fp-label">Repetir contraseña</span>
        <input type="password" [formField]="formulario.repeatedPassword">
        <app-form-error [field]="formulario.repeatedPassword()" />
      </label>

      <button class="fp-submit" type="submit" [disabled]="!token">Enviar</button>
    </form>
  </div>
</div>
