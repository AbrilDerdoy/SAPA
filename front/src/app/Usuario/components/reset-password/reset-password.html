<form novalidate (submit)="enviar($event)">
    @if (!token) {
    <p class="server-info" role="status">
        El enlace no es válido o está incompleto.
        <a [routerLink]="['/forgotPassword']">Pedí uno nuevo</a>.
    </p>
    }
    <label>
        contraseña nueva:
        <input type="password" [formField]="formulario.password">
        <app-form-error [field]="formulario.password()" />
    </label>
    <label>
        repetir contraseña:
        <input type="password" [formField]="formulario.repeatedPassword">
        <app-form-error [field]="formulario.repeatedPassword()" />
    </label>
    <button type="submit" [disabled]="!token">Enviar</button>
</form>
