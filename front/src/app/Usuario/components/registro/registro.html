
<div class="reg">
  <aside class="reg-brand">
    <img class="reg-brand__logo" src="/images/logo.png" alt="Logo SAPA">
  </aside>

  <div class="reg-side">
    <form class="reg-form" novalidate (submit)="enviar($event)">
      <header class="reg-form__head">
        <h1 class="reg-form__title">Creá tu cuenta</h1>
        <p class="reg-form__lead">Elegí cómo vas a usar SAPA y completá tus datos.</p>
      </header>

      <div class="reg-switch" role="group" aria-label="Tipo de usuario">
        <button
          type="button"
          [class.is-active]="modelo().role === 'ROLE_PATIENT'"
          [attr.aria-pressed]="modelo().role === 'ROLE_PATIENT'"
          (click)="cambiarPaciente()"
        >
          Paciente
        </button>
        <button
          type="button"
          [class.is-active]="modelo().role === 'ROLE_DOCTOR'"
          [attr.aria-pressed]="modelo().role === 'ROLE_DOCTOR'"
          (click)="cambiarMedico()"
        >
          Médico
        </button>
        <button
          type="button"
          [class.is-active]="modelo().role === 'ROLE_TUTOR'"
          [attr.aria-pressed]="modelo().role === 'ROLE_TUTOR'"
          (click)="cambiarTutor()"
        >
          Tutor
        </button>
      </div>

      @if (errorRegistro()) {
        <p class="reg-notice reg-notice--error" role="alert">{{ errorRegistro() }}</p>
      }

      <div class="reg-row">
        <label class="reg-field">
          <span class="reg-label">Nombre</span>
          <input type="text" autocomplete="given-name" [formField]="formulario.firstName">
          <app-form-error [field]="formulario.firstName()" />
        </label>
        <label class="reg-field">
          <span class="reg-label">Apellido</span>
          <input type="text" autocomplete="family-name" [formField]="formulario.lastName">
          <app-form-error [field]="formulario.lastName()" />
        </label>
      </div>

      <label class="reg-field">
        <span class="reg-label">Email</span>
        <input type="email" autocomplete="email" [formField]="formulario.email">
        <app-form-error [field]="formulario.email()" />
      </label>

      <label class="reg-field">
        <span class="reg-label">Contraseña</span>
        <span class="reg-password">
          <input
            [type]="mostrarPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
            [formField]="formulario.password"
          >
          <button
            class="reg-password__toggle"
            type="button"
            [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="mostrarPassword()"
            (click)="alternarVisibilidadPassword()"
          >
            <img
              [src]="mostrarPassword() ? '/images/eye.svg' : '/images/eye-off.svg'"
              alt=""
            >
          </button>
        </span>
        <app-form-error [field]="formulario.password()" />
      </label>

      <div class="reg-row">
        <label class="reg-field">
          <span class="reg-label">Fecha de nacimiento</span>
          <input type="date" autocomplete="bday" [formField]="formulario.birthDate">
          <app-form-error [field]="formulario.birthDate()" />
        </label>
        <label class="reg-field">
          <span class="reg-label">Teléfono</span>
          <input type="tel" inputmode="tel" autocomplete="tel" [formField]="formulario.phoneNumber">
          <app-form-error [field]="formulario.phoneNumber()" />
        </label>
      </div>

      @if (modelo().role === 'ROLE_DOCTOR') {
        <div class="reg-row">
          <label class="reg-field">
            <span class="reg-label">Matrícula</span>
            <input type="text" autocomplete="off" [formField]="formulario.licenseNumber">
            <app-form-error [field]="formulario.licenseNumber()" />
          </label>
          <label class="reg-field">
            <span class="reg-label">Especialidad</span>
            @if (especialidades.isLoading()) {
              <span class="reg-help">Cargando especialidades…</span>
            }
            @if (especialidades.error()) {
              <span class="reg-help reg-help--error">No pudimos cargar las especialidades.</span>
            }
            <select id="speciality" [value]="modelo().speciality ?? ''" (change)="seleccionarEspecialidad($event)">
              <option value="">Seleccioná una especialidad</option>
              @if (especialidades.hasValue()) {
                @for (es of especialidades.value(); track es.id) {
                  <option [value]="es.id">{{ es.name }}</option>
                }
              }
            </select>
            <app-form-error [field]="formulario.speciality()" />
          </label>
        </div>

        <p class="reg-notice" role="note">
          Los médicos pasan por una revisión de la administración antes de poder ingresar.
        </p>
      }

      @if (modelo().role === 'ROLE_TUTOR') {
        <label class="reg-field">
          <span class="reg-label">Parentesco</span>
          <select [formField]="formulario.relationship">
            <option value="">Seleccioná el parentesco</option>
            <option value="Madre">Madre</option>
            <option value="Padre">Padre</option>
            <option value="Tutor legal">Tutor legal</option>
            <option value="Abuelo/a">Abuelo/a</option>
            <option value="Hermano/a">Hermano/a</option>
            <option value="Tío/a">Tío/a</option>
            <option value="Otro familiar">Otro familiar</option>
          </select>
          <app-form-error [field]="formulario.relationship()" />
        </label>
      }

      <button class="reg-submit" type="submit">Crear cuenta</button>
    </form>
  </div>
</div>
