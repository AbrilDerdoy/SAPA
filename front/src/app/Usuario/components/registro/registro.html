<div class="container">

    <aside class="left">
        <img src="/images/logo.png" alt="Logo SAPA">
    </aside>

    <div class="right">
        <form novalidate (submit)="enviar($event)">
            <h2>Informacion Personal</h2>
            <div class="botones-tipo-usuario">
                <button type="button" class="botones-usuario" (click)="cambiarPaciente()">Paciente</button>
                <button type="button" class="botones-usuario" (click)="cambiarMedico()">Medico</button>
                <button type="button" class="botones-usuario" (click)="cambiarTutor()">Tutor</button>
            </div>
            @if (errorRegistro()) {
            <p class="server-error" role="alert">{{errorRegistro()}}</p>
            }
            <label>
                Nombre:
                <input type="text" [formField]="formulario.firstName">
                <app-form-error [field]="formulario.firstName()" />
            </label>
            <label>
                Apellido:
                <input type="text" [formField]="formulario.lastName">
                <app-form-error [field]="formulario.lastName()" />
            </label>
            <label>
                Email
                <input type="email" [formField]="formulario.email">
                <app-form-error [field]="formulario.email()" />
            </label>
            <label>
                Contraseña
                <div class="password-input">
                    <input [type]="mostrarPassword() ? 'text' : 'password'" [formField]="formulario.password">
                    <button
                        class="btn-toggle-password"
                        type="button"
                        [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                        [attr.aria-pressed]="mostrarPassword()"
                        (click)="alternarVisibilidadPassword()">
                        <img [src]="mostrarPassword() ? '/images/eye-off.svg' : '/images/eye.svg'" alt="">
                    </button>
                </div>
                <app-form-error [field]="formulario.password()" />
            </label>
            <label>
                Fecha de nacimiento
                <input type="date" [formField]="formulario.birthDate">
                <app-form-error [field]="formulario.birthDate()" />
            </label>
            <label>
                Telefono:
                <input type="tel" [formField]="formulario.phoneNumber">
                <app-form-error [field]="formulario.phoneNumber()" />
            </label>
            @if(modelo().role === 'ROLE_TUTOR'){
            <label>
                Parentesco con el paciente:
                <select [value]="modelo().relationship" (change)="actualizarParentesco($event)">
                    <option value="">Seleccioná un parentesco</option>
                    @for (relacion of relationships; track relacion) {
                    <option [value]="relacion">{{relacion}}</option>
                    }
                </select>
                <app-form-error [field]="formulario.relationship()" />
            </label>
            }
            @if(modelo().role === 'ROLE_DOCTOR'){
            <label>
                Matricula:
                <input type="text" [formField]="formulario.licenseNumber">
                <app-form-error [field]="formulario.licenseNumber()" />
            </label>
            <label>
                Especialidad:
                @if(especialidades.isLoading()){
                <p>Cargando especialidades...</p>
                }
                @if(especialidades.error()){
                <p class="error">Hubo un error cargando las especialidades</p>
                }
                <select id="speciality" [value]="modelo().speciality ?? ''" (change)="seleccionarEspecialidad($event)">
                    <option value="">Selecciona una especialidad</option>
                    @for(es of especialidades.value(); track es.id){
                    <option [value]="es.id">{{es.name}}</option>
                    }
                </select>
                <app-form-error [field]="formulario.speciality()" />
            </label>
            }

            <button type="submit">Enviar</button>
        </form>
    </div>

</div>
