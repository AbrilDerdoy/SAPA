<div class="user-menu">

  <button (click)="toggleMenu()">
    <span>Mi cuenta</span>
    <i class="bi bi-chevron-down"></i>
  </button>

  @if (menuAbierto()) {
    <div class="dropdown">

      <a [routerLink]="['/profile']" (click)="toggleMenu()">
        <i class="bi bi-person"></i>
        Mi perfil
      </a>
      <hr>

      <button (click)="auth.logout()">
        <i class="bi bi-box-arrow-right"></i>
        Cerrar sesión
      </button>

    </div>
  }

</div>
