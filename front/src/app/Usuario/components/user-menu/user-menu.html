<div class="user-menu">

  <button
    type="button"
    class="menu-trigger"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuAbierto()"
    aria-controls="user-dropdown"
    aria-label="Menú de usuario">
    <img class="menu-icon" src="/images/menu.svg" alt="" aria-hidden="true">
  </button>

  @if (menuAbierto()) {
    <div class="dropdown">

      <a [routerLink]="['/profile']" (click)="toggleMenu()">
        <i class="bi bi-person"></i>
        Mi perfil
      </a>
      <hr>
      @if(auth.isAdmin()){
        <a [routerLink]="['/admin']" (click)="toggleMenu()">
          <i class="bi bi-shield-lock"></i>
          Panel de administración
        </a>
        <hr>
      }
      <button type="button" class="theme-toggle" (click)="theme.toggleTheme()" [attr.aria-pressed]="theme.theme()==='dark'">
        @if(theme.theme()==='dark'){
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
           aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        Tema Claro
        } @else {
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
           aria-hidden="true">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
        Tema Oscuro
        }
      </button>
      <hr>
      <button (click)="auth.logout()">
        <i class="bi bi-box-arrow-right"></i>
        Cerrar sesión
      </button>

    </div>
  }

</div>
