<div class="user-menu">

  <button
    type="button"
    class="menu-trigger"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuAbierto()"
    aria-controls="user-dropdown"
    aria-label="Menú de usuario">

    <img
      class="menu-icon"
      src="/images/menu.svg"
      alt=""
      aria-hidden="true">

  </button>

  @if (menuAbierto()) {

    <div class="dropdown" id="user-dropdown">

      <a
        [routerLink]="['/profile']"
        (click)="toggleMenu()">

        <i class="bi bi-person"></i>
        Mi perfil

      </a>

      @if (auth.isPatient()) {
        <a
        [routerLink]="['/medical-record']"
        (click)="toggleMenu()">
        <i class="bi bi-medical-record"></i>
        Mi ficha médica
        </a>
      }

      @if (auth.isDoctor()) {
        <a 
        [routerLink]="['/patient-medical-record']"
        (click)="toggleMenu()">
        <i class="bi bi-patient-medical-record"></i>
        Fichas de pacientes
        </a>
      }

      <a
        [routerLink]="['/chat']"
        (click)="toggleMenu()">

        <i class="bi bi-chat-dots"></i>
        Mensajes

      </a>

      <hr>

      <button
        type="button"
        class="configuration-button"
        (click)="toggleConfiguracion()"
        [attr.aria-expanded]="configuracionAbierta()">

        <i class="bi bi-gear"></i>
        Configuración

        <i
          class="bi"
          [class.bi-chevron-down]="!configuracionAbierta()"
          [class.bi-chevron-up]="configuracionAbierta()">
        </i>

      </button>

      @if (configuracionAbierta()) {

        <div class="configuration-options">

          <button
            type="button"
            class="theme-toggle"
            (click)="theme.toggleTheme()"
            [attr.aria-pressed]="theme.theme() === 'dark'">

            @if (theme.theme() === 'dark') {

              <i class="bi bi-sun"></i>
              Tema claro

            } @else {

              <i class="bi bi-moon"></i>
              Tema oscuro

            }

          </button>

          <label class="bubble-setting">

            <input
              type="checkbox"
              [checked]="bubblePreference.enabled()"
              (change)="cambiarPreferenciaBurbuja()">

            <span>Mostrar burbuja de mensajes</span>

          </label>

        </div>

      }

      @if (auth.isAdmin()) {

        <hr>

        <a
          [routerLink]="['/admin']"
          (click)="toggleMenu()">

          <i class="bi bi-shield-lock"></i>
          Panel de administración

        </a>

      }

      <hr>

      <button
        type="button"
        class="logout-button"
        (click)="auth.logout()">

        <i class="bi bi-box-arrow-right"></i>
        Cerrar sesión

      </button>

    </div>

  }

</div>
