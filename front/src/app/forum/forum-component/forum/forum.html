<section class="forum">
    <h1 class="foros">Foros</h1>

    @if (error()) {<p class="error">{{ error() }}</p>}

    <div class="filter">
        <input type="text" placeholder="Buscar por título" [(ngModel)]="titleFilter" (keyup.enter)="filterForums()">

        <button type="button" (click)="filterForums()">Buscar</button>
        <button type="button" (click)="loadForums()">Ver todos</button>
    </div>

    <div class="actions">
        <button type="button" (click)="loadActiveForums()">Activos</button>
        <button type="button" (click)="loadInactiveForums()">Inactivos</button>

        @if(sesionIniciada){ <button type="button" [routerLink]="['/forums/create']">Crear foro</button> }
    </div>

    <div class="forum-list">
        @for (forum of filteredForums(); track forum.forumId) {
        <article class="forum-card">
            <h2>{{ forum.title }}</h2>
            <p>{{ forum.content }}</p>
            <button type="button" class="view" [routerLink]="['/forums', forum.title]">Ver publicaciones</button>

            @if(esPropietario(forum)){
                <button type="button" class="edit" [routerLink]="['/forums/update', forum.title]">Editar</button>
                <button type="button" class="delete" (click)="deleteForum(forum.forumId)">Eliminar</button>
            }
        </article>
        } @empty {
            <p>No hay foros para mostrar.</p>
        }
    </div>

</section>
