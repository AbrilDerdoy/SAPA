spring.application.name=SAPA

spring.datasource.url=jdbc:mysql://localhost:3306/sapa
spring.datasource.username=root
spring.datasource.password=

server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web.socket=ERROR

spring.sql.init.mode=always

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.expiration=3600000
jwt.refresh-expiration=604800000
jwt_secret=EstaEsUnaClaveSecretaSuperSeguraYMuyLargaParaSapaApi2026Sininonizados
access_token=mi-access-token-secreto-largo

# GMAIL_APP_PASSWORD must be a Google App Password, not the account password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000